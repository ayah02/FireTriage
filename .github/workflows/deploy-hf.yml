name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - claude/streamlit-app-setup-prYYN
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Deploy to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 << 'EOF'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)

          # Create space (no-op if already exists)
          api.create_repo(
              repo_id="AYAHAlqassab/FireTriage",
              repo_type="space",
              space_sdk="streamlit",
              private=False,
              exist_ok=True,
          )
          print("Space ready.")

          # Set secrets
          for key, env in [("GROQ_API_KEY", "GROQ_API_KEY"), ("OPENROUTER_API_KEY", "OPENROUTER_API_KEY")]:
              val = os.environ.get(env, "")
              if val:
                  api.add_space_secret("AYAHAlqassab/FireTriage", key, val)
                  print(f"Secret {key} set.")

          # Upload files
          for fname in ["app.py", "requirements.txt"]:
              api.upload_file(
                  path_or_fileobj=fname,
                  path_in_repo=fname,
                  repo_id="AYAHAlqassab/FireTriage",
                  repo_type="space",
                  commit_message=f"deploy: update {fname}",
              )
              print(f"Uploaded {fname}.")

          # Upload README with HF metadata
          readme = """---
title: FireTriage — Project IgnitionHorizon
emoji: 🔥
colorFrom: red
colorTo: orange
sdk: streamlit
sdk_version: 1.41.0
app_file: app.py
pinned: true
license: mit
short_description: Wildfire tactical triage dashboard with AI copilot
---

# FireTriage — Project IgnitionHorizon
Wildfire tactical triage dashboard with survival analysis ML + AI Copilot.
"""
          import tempfile, pathlib
          with tempfile.NamedTemporaryFile("w", suffix=".md", delete=False) as f:
              f.write(readme)
              tmp = f.name
          api.upload_file(
              path_or_fileobj=tmp,
              path_in_repo="README.md",
              repo_id="AYAHAlqassab/FireTriage",
              repo_type="space",
              commit_message="deploy: update README",
          )
          print("Uploaded README.md.")
          print("Deployment complete: https://huggingface.co/spaces/AYAHAlqassab/FireTriage")
          EOF
