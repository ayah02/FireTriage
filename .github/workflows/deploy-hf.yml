name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - claude/streamlit-app-setup-prYYN
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Deploy to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python deploy.py 2>&1 | tee deploy_log.txt; exit ${PIPESTATUS[0]}

      - name: Push deploy log back to repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add deploy_log.txt
          git diff --staged --quiet || git commit -m "ci: deploy log [skip ci]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/ayah02/FireTriage.git" HEAD:claude/streamlit-app-setup-prYYN
